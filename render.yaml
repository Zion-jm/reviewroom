services:
  - type: web
    name: reviewroom
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
